# fly.toml app configuration file for saui
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'saui'
primary_region = 'lhr'

[build]

[env]
  SAUI_ADDR = ':8080'
  SAUI_DB = '/data/saui.db'
  SAUI_SECURE = 'true'

[[mounts]]
  source = 'saui_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
