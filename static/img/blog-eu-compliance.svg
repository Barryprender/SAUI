<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="82%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0d1728"/>
      <stop offset="100%" stop-color="#050911"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="0.9" fill="#4b6480" opacity="0.32"/>
    </pattern>
    <filter id="f-blue" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-gold" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- Far-field decorative nodes -->
  <g fill="none" stroke="#1a3060" stroke-width="1.4" opacity="0.2">
    <circle cx="120" cy="150" r="7"/>
    <circle cx="80"  cy="410" r="5"/>
    <circle cx="180" cy="640" r="8"/>
    <circle cx="300" cy="800" r="6"/>
    <circle cx="1300" cy="760" r="6"/>
    <circle cx="1440" cy="600" r="8"/>
    <circle cx="1510" cy="410" r="5"/>
    <circle cx="1450" cy="230" r="7"/>
    <circle cx="1310" cy="130" r="6"/>
    <circle cx="1120" cy="70"  r="5"/>
    <circle cx="470"  cy="70"  r="5"/>
    <circle cx="250"  cy="55"  r="4"/>
  </g>

  <!-- Star ring: 12 EU stars orbiting the authoritative core -->
  <g fill="#e9b949" filter="url(#f-gold)">
    <!-- 12 stars at 30deg increments, radius ~250 around (800,430) -->
    <use href="#star" x="800"  y="180"/>
    <use href="#star" x="925"  y="213"/>
    <use href="#star" x="1017" y="305"/>
    <use href="#star" x="1050" y="430"/>
    <use href="#star" x="1017" y="555"/>
    <use href="#star" x="925"  y="647"/>
    <use href="#star" x="800"  y="680"/>
    <use href="#star" x="675"  y="647"/>
    <use href="#star" x="583"  y="555"/>
    <use href="#star" x="550"  y="430"/>
    <use href="#star" x="583"  y="305"/>
    <use href="#star" x="675"  y="213"/>
  </g>

  <!-- Star definition (5-pointed, ~18px) -->
  <defs>
    <path id="star" transform="translate(-14,-14) scale(0.028)"
      d="M500 0 L618 382 L1000 382 L691 618 L809 1000 L500 764 L191 1000 L309 618 L0 382 L382 382 Z"/>
  </defs>

  <!-- Faint ring guide -->
  <circle cx="800" cy="430" r="250" fill="none" stroke="#e9b949" stroke-width="1" opacity="0.12"/>

  <!-- Central shield: authoritative server core -->
  <g filter="url(#f-blue)">
    <path d="M800 322 L878 352 L878 452 Q878 534 800 566 Q722 534 722 452 L722 352 Z"
      fill="#091e3e" stroke="#3b82f6" stroke-width="3"/>
  </g>
  <!-- Server rails inside shield -->
  <g stroke="#60a5fa" stroke-width="2" opacity="0.85" stroke-linecap="round">
    <line x1="762" y1="392" x2="838" y2="392"/>
    <line x1="762" y1="428" x2="838" y2="428"/>
    <line x1="762" y1="464" x2="812" y2="464"/>
  </g>
  <circle cx="820" cy="392" r="3" fill="#7dd3fc"/>
  <circle cx="820" cy="428" r="3" fill="#7dd3fc"/>

  <text x="800" y="288" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="12" fill="#60a5fa" letter-spacing="0.16em" opacity="0.9">AUTHORITATIVE STATE</text>
  <text x="800" y="612" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="11" fill="#7dd3fc" letter-spacing="0.1em" opacity="0.72">server-owned · logged · mediated</text>

  <!-- Regulation callout chips around the ring -->
  <g font-family="ui-monospace, 'Cascadia Code', monospace" font-size="12" letter-spacing="0.04em">
    <g>
      <rect x="120" y="250" width="196" height="46" rx="6" fill="#0a1224" stroke="#1e3a6e" stroke-width="1" opacity="0.85"/>
      <text x="218" y="270" text-anchor="middle" fill="#94a3b8" font-weight="600">GDPR Art. 25 / 32</text>
      <text x="218" y="287" text-anchor="middle" fill="#64748b" font-size="10">by design · by default</text>
    </g>
    <g>
      <rect x="120" y="470" width="196" height="46" rx="6" fill="#0a1224" stroke="#1e3a6e" stroke-width="1" opacity="0.85"/>
      <text x="218" y="490" text-anchor="middle" fill="#94a3b8" font-weight="600">NIS2 Directive</text>
      <text x="218" y="507" text-anchor="middle" fill="#64748b" font-size="10">risk mgmt · incident logs</text>
    </g>
    <g>
      <rect x="1284" y="250" width="196" height="46" rx="6" fill="#0a1224" stroke="#1e3a6e" stroke-width="1" opacity="0.85"/>
      <text x="1382" y="270" text-anchor="middle" fill="#94a3b8" font-weight="600">Cyber Resilience Act</text>
      <text x="1382" y="287" text-anchor="middle" fill="#64748b" font-size="10">secure by default</text>
    </g>
    <g>
      <rect x="1284" y="470" width="196" height="46" rx="6" fill="#0a1224" stroke="#1e3a6e" stroke-width="1" opacity="0.85"/>
      <text x="1382" y="490" text-anchor="middle" fill="#94a3b8" font-weight="600">DORA · OWASP</text>
      <text x="1382" y="507" text-anchor="middle" fill="#64748b" font-size="10">resilience · A01 access</text>
    </g>
  </g>

  <!-- Connective lines from chips to ring -->
  <g stroke="#1d3e78" stroke-width="1.6" opacity="0.4" stroke-dasharray="4 6">
    <line x1="316" y1="273" x2="560" y2="360"/>
    <line x1="316" y1="493" x2="560" y2="500"/>
    <line x1="1284" y1="273" x2="1040" y2="360"/>
    <line x1="1284" y1="493" x2="1040" y2="500"/>
  </g>

  <!-- Bottom caption bar -->
  <rect x="0" y="858" width="1600" height="42" fill="#04070f" opacity="0.72"/>
  <text x="800" y="884" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="11" fill="#334155" letter-spacing="0.18em">EU COMPLIANCE BY ARCHITECTURE · DATA PROTECTION BY DESIGN · SERVER-AUTHORITATIVE STATE</text>
</svg>
